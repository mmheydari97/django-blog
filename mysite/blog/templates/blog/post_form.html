{% extends "blog/base.html" %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h1><i class="fas fa-pen" aria-hidden="true"></i> {% if object %}Edit Post{% else %}New Post{% endif %}</h1>
    </div>
    <div class="card-body">
        <form class="post-form" method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label for="id_author" class="form-label">Author</label>
                {{ form.author }}
            </div>

            <div class="mb-3">
                <label for="id_title" class="form-label">Title</label>
                {{ form.title }}
            </div>

            <div class="mb-3">
                <label for="id_text" class="form-label">Content</label>
                {{ form.text }}
                <div class="form-text">Select text to format it with the editor toolbar.</div>
            </div>

            <div class="form-actions">
                <a href="javascript:history.back()" class="btn btn-outline-secondary">
                    <i class="fas fa-arrow-left" aria-hidden="true"></i> Cancel
                </a>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-floppy-disk" aria-hidden="true"></i> Save Post
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    var editor = new MediumEditor('.editable', {
        toolbar: {
            buttons: ['bold', 'italic', 'underline', 'anchor', 'h2', 'h3', 'quote', 'orderedlist', 'unorderedlist']
        },
        placeholder: {
            text: 'Write your post content here...'
        }
    });
</script>
{% endblock %}
