{% extends "blog/base.html" %}

{% block content %}
<div class="card">
    <div class="card-header">
        <h1><i class="far fa-comment" aria-hidden="true"></i> Add a Comment</h1>
    </div>
    <div class="card-body">
        <form class="comment-form" method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label for="id_author" class="form-label">Your Name</label>
                {{ form.author }}
            </div>

            <div class="mb-3">
                <label for="id_text" class="form-label">Comment</label>
                {{ form.text }}
            </div>

            <div class="form-actions">
                <a href="javascript:history.back()" class="btn btn-outline-secondary">
                    <i class="fas fa-arrow-left" aria-hidden="true"></i> Back
                </a>
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-paper-plane" aria-hidden="true"></i> Post Comment
                </button>
            </div>
        </form>
    </div>
</div>

<script>
    var editor = new MediumEditor('.editable');
</script>
{% endblock %}
