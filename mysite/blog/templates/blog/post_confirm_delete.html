{% extends "blog/base.html" %}

{% block content %}
<div class="card">
    <div class="card-header is-danger">
        <h1><i class="fas fa-triangle-exclamation" aria-hidden="true"></i> Delete Post</h1>
    </div>
    <div class="card-body">
        <p class="mb-2">Are you sure you want to delete <strong>“{{ object }}”</strong>?</p>
        <p class="text-muted">This action cannot be undone.</p>

        <form method="POST">
            {% csrf_token %}
            <div class="form-actions">
                <a href="javascript:history.back()" class="btn btn-outline-secondary">
                    <i class="fas fa-arrow-left" aria-hidden="true"></i> Cancel
                </a>
                <button type="submit" class="btn btn-danger">
                    <i class="fas fa-trash" aria-hidden="true"></i> Delete Permanently
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
